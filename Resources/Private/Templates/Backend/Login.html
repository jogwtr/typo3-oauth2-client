<html
        xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>

    <f:layout name="Backend/Login" />

    <f:section name="loginFormFields">
        <f:for each="{providers}" as="provider">
            <f:variable name="providerLabel"><f:translate id="{provider.label}" default="{provider.label}" /></f:variable>
            <div class="form-group d-grid mb-2">
                <button
                        class="btn btn-login d-flex t3js-login-submit"
                        style="justify-content: space-between"
                        type="submit"
                        name="provider_identifier"
                        value="{provider.hashedIdentifier}"
                        data-loading-text="{f:render(section: 'providerLogin', arguments: '{_all}') -> f:format.htmlspecialchars()}"
                >
                    <f:render section="providerOption" arguments="{_all}" />
                </button>
            </div>
        </f:for>
    </f:section>

    <f:section name="providerOption">
        <span><core:icon identifier="{provider.iconIdentifier}" /></span>
        <span style="flex: 1;">{providerLabel}</span>
    </f:section>

    <f:section name="providerLogin">
        <span>{core:icon(identifier: 'spinner-circle', size: 'small') -> f:format.raw()}</span>
        <span style="flex: 1;"><f:translate id="LLL:EXT:oauth2_client_nuevo/Resources/Private/Language/locallang.xlf:login.process" arguments="{0: providerLabel}" /></span>
    </f:section>
</html>
